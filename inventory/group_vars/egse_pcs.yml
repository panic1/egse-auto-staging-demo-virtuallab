---
# Connection and network defaults for the EGSE PCs.
ansible_user: ops
ansible_ssh_private_key_file: "{{ playbook_dir }}/../../lab/keys/egse-demo"

# Network defaults shared by all EGSE PCs (per-PC addresses are in host_vars/).
staging_gateway: 10.10.0.2        # staging server on the isolated staging net

# Where the EGSE PC fetches packages during the production phase. The online
# default is the Ubuntu archive; offline mode (./scripts/setup.sh) points this
# at the bundled apt repo served by the host.
apt_mirror: "http://archive.ubuntu.com/ubuntu"