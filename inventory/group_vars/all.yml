---
# Global lab configuration — the single source of truth for VM sizing, network
# layout, and install assets. The demo scripts read these via ansible-inventory
# (see scripts/lib/common.sh, labvar()); Ansible uses the same values when it
# manages the machines.

# VM sizes are deliberately small — the demo needs no performance.
staging_vm_memory_mb: 1024
staging_vm_vcpus: 1
staging_vm_disk_gb: 10
egse_pc_vm_memory_mb: 1024
egse_pc_vm_vcpus: 1
egse_pc_vm_disk_gb: 8

# VM creation.
os_variant: ubuntu24.04
nic_model: virtio
# The EGSE PC uses e1000 + IDE (not virtio) so the tiny busybox deploy
# initramfs needs no extra kernel modules (its NIC driver is e1000, and the
# IDE controller is built into the kernel). See README assumptions.
# The i440fx ('pc') machine type is required because the default q35 machine
# has no IDE controllers.
egse_pc_nic_model: e1000
egse_pc_disk_bus: ide
egse_pc_machine_type: pc
egse_pc_boot_order: "network,hd"
egse_pc_name_prefix: "egse_pc-"

# Which EGSE PCs demo.sh stages: 'all' = every PC in the inventory; or a list,
# e.g. [egse_pc-02] to stage just that one. The default stages one PC; to add a
# second PC to a running lab, set it to [egse_pc-02] (or all) and run demo.sh
# again — no setup.sh needed, the dnsmasq reservations are already primed for
# every PC in the inventory (see hosts.yml). Config, not a flag, so runs stay
# reproducible.
#
# Accepted syntax:
#   egse_pc_scope: all                 # every PC in the inventory
#   egse_pc_scope: [egse_pc-01]        # inline list: just egse_pc-01
#   egse_pc_scope: [egse_pc-01, egse_pc-02]   # inline list: both PCs
#   egse_pc_scope:                      # block list (same as inline)
#     - egse_pc-01
#     - egse_pc-02
egse_pc_scope: [egse_pc-01]

# Networks. Both are defined by the demo scripts in the system daemon
# (qemu:///system). The production network is NAT (the machines' "production"
# network); the staging network is an isolated bridge with no host address.
# Dedicated bridge names avoid colliding with the host's standard 'default'
# network (virbr0 on 192.168.122.1) — which is why the production subnet is
# deliberately NOT 192.168.122.0/24.
#
# The production network has NO DHCP: every device on it is pinned to a static
# address (staging server eth0, and each PC after handover). DHCP exists only
# on the isolated staging network, served by dnsmasq on the staging server for
# the PXE install.
staging_network: staging-net
production_network: production-net
production_network_bridge: virbr-prod
staging_subnet: 10.10.0.0/24
production_subnet: 10.10.122.0/24

# DHCP served by the staging server's dnsmasq on the isolated staging network,
# for the PXE install. Must cover the per-PC staging_ip reservations in
# inventory/host_vars/ (each PC also has an explicit dhcp-host reservation
# generated from the inventory).
staging_dhcp_range: "10.10.0.10,10.10.0.100,255.255.255.0,12h"

# Gateways/DNS (host side of the production NAT network).
production_gateway: 10.10.122.1
production_dns: 10.10.122.1

# libvirt connection the demo uses. The system daemon (qemu:///system) is
# required — the session daemon cannot create the bridge networks the demo
# needs. VM disks and seed ISOs are created as volumes in the 'default'
# storage pool (/var/lib/libvirt/images) so the libvirt-qemu user can access
# them without touching this repo's permissions.
libvirt_uri: qemu:///system
storage_pool: default

# Install assets.
cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"

# The bundled apt repo for the OFFLINE demo (see scripts/fetch_dependencies.sh).
# It is a flat repo on the host (apt_repo_dir) that the staging server serves
# at apt_repo_url, so the PC's production phase can install the EGSE software
# stack with no internet. The demo's online default uses archive.ubuntu.com
# (apt_mirror in group_vars/egse_pcs.yml).
apt_repo_dir: lab/apt-repo
apt_repo_url: "http://10.10.122.2/apt"

# Demo mode (auto-detected by demo.sh, see scripts/lib/common.sh detect_mode):
#   apt_offline - true -> the PC's production phase installs from the bundled
#                 apt repo (apt_repo_url) instead of archive.ubuntu.com
#                 (apt_mirror). demo.sh passes this as an extra var when it
#                 detects the network is down; the inventory default is online.
apt_offline: false

# The PXE deploy tool is built from a pinned Ubuntu kernel + its modules
# (extracted from these .debs by scripts/generate_golden_image.sh). Pinning a
# specific version keeps the deploy tool reproducible and independent of the
# presenter's host kernel.
deploy_kernel_url: "http://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-image-unsigned-6.8.0-146-generic_6.8.0-146.146_amd64.deb"
deploy_modules_url: "http://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-modules-6.8.0-146-generic_6.8.0-146.146_amd64.deb"

# Open a show-and-tell ssh terminal into the staging server once it is up
# (see scripts/lib/common.sh open_ssh_terminal). Off by default so setup stays
# quiet; set to true to get a live terminal after the server is reachable.
open_terminal_on_setup: true

# demo.sh behavior (config-over-flags, see AGENTS.md):
#   demo_pause           - press-Enter pause between demo stages for narration.
#   open_terminal_on_demo - open a show-and-tell ssh terminal into each PC.
demo_pause: true
open_terminal_on_demo: true

# Remove cache, keys, and golden image on teardown. Default true keeps the host
# clean after a demo; set false to preserve the offline-backup assets.
#
# REMINDER: during repeated setup/teardown testing, set this to false so the
# cache and golden image survive each teardown (otherwise every run re-fetches
# them). Remember to revert it to your intended value before the real demo.
teardown_clean: true