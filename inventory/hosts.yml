---
# Single source of truth for the demo's machines.
#
# Groups:
#   staging   - the staging server (stands in for the lab tool that preps IPCs)
#   egse_pcs  - the EGSE PCs to be staged (industrial-PC stand-in VMs)
#
# Per-PC identity (MAC, staging IP, production IP, hostname) lives in
# inventory/host_vars/egse_pc-<id>.yml. Connection details are in group_vars/.
# The EGSE PC playbooks pick the active address via staging_ip/production_ip
# depending on which network the PC is on during the demo.
all:
  children:
    staging:
      hosts:
        staging-server: {}
    egse_pcs:
      hosts:
        egse_pc-01: {}