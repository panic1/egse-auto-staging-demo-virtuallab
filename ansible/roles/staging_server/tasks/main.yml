---
# Entry point for the staging_server role. Implemented in ROADMAP Task 3/4.
# - installs and configures dnsmasq for DHCP + TFTP + PXE on the isolated
#   staging network only (eth1)
# - deploys the PXE boot files and the golden image to the tftp/http roots
# - serves a bundled apt repository (used in offline mode)
# - becomes the Ansible control node for the PCs
- name: Install staging server packages
  ansible.builtin.apt:
    name:
      - dnsmasq
      - pxelinux
      - syslinux-common
      - ansible
      - rsync
    state: present
    update_cache: true

