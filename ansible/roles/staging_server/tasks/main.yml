---
# Entry point for the staging_server role.
# - installs and configures dnsmasq for DHCP + TFTP + PXE on the isolated
#   staging network only (eth1)
# - deploys the PXE boot files and the golden image to the tftp/http roots
# - serves a bundled apt repository (used in offline mode, Task 6/7)
# - becomes the Ansible control node for the PCs
# When the setup run is offline, point apt at the bundled flat repo (rsynced
# with the demo to {{ demo_dir }}/lab/apt-repo) instead of the Ubuntu archive,
# and drop the archive sources so `apt-get update` never needs the network.
# This mirrors the PC's production phase (egse_pc/tasks/production.yml): the
# same "use the bundle when offline" idea, applied to the staging server's own
# packages. The staging server is disposable, so the rewritten sources need no
# restore step.
- name: Check the bundled offline apt repo is present (offline setup)
  ansible.builtin.stat:
    path: "{{ demo_dir }}/lab/apt-repo/Packages"
  register: staging_apt_repo_stat
  when: apt_offline | default(false) | bool

- name: Fail with guidance when the offline apt repo is missing
  ansible.builtin.fail:
    msg: >-
      Offline setup needs the bundled apt repo at {{ demo_dir }}/lab/apt-repo,
      but it is not there. Run ./scripts/fetch_dependencies.sh (or an online
      ./scripts/setup.sh) once so the staging server's packages are bundled.
  when:
    - apt_offline | default(false) | bool
    - not staging_apt_repo_stat.stat.exists

- name: Point apt at the bundled offline repo
  ansible.builtin.copy:
    content: |
      # Offline setup: the bundled apt repo, synced with the demo.
      deb [trusted=yes] file:{{ demo_dir }}/lab/apt-repo ./
    dest: /etc/apt/sources.list
    mode: "0644"
  when: apt_offline | default(false) | bool

- name: Remove the deb822 default sources so only the bundled repo is used
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ubuntu.sources
    state: absent
  when: apt_offline | default(false) | bool

- name: Install staging server packages
  ansible.builtin.apt:
    name: "{{ staging_packages }}"
    state: present
    update_cache: true

- name: Create the tftp and http roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ tftp_root }}"
    - "{{ tftp_root }}/pxelinux.cfg"
    - "{{ http_root }}"

# --- PXE boot files (tftp root) -------------------------------------------

- name: Install the PXELINUX bootloader and syslinux bios modules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ tftp_root }}/"
    remote_src: true
    mode: "0644"
  loop:
    - /usr/lib/PXELINUX/pxelinux.0
    - /usr/lib/syslinux/modules/bios/ldlinux.c32
    - /usr/lib/syslinux/modules/bios/menu.c32
    - /usr/lib/syslinux/modules/bios/libutil.c32
    - /usr/lib/syslinux/modules/bios/libcom32.c32

- name: Deploy the deploy kernel + initramfs (built by generate_golden_image.sh)
  ansible.builtin.copy:
    src: "{{ demo_dir }}/lab/deploy/{{ item.src }}"
    dest: "{{ tftp_root }}/{{ item.dst }}"
    remote_src: true
    mode: "0644"
  loop:
    - { src: vmlinuz, dst: vmlinuz-deploy }
    - { src: initramfs.gz, dst: initramfs-deploy.gz }

- name: Write the PXE boot menu
  ansible.builtin.template:
    src: pxelinux-default.j2
    dest: "{{ tftp_root }}/pxelinux.cfg/default"
    mode: "0644"

# --- dnsmasq (DHCP + TFTP + PXE on the staging interface) -------------------

# The interface name is unpredictable (ens3/enp2s0/...) — it depends on the
# PCI slot QEMU gives the NIC. Resolve it from the staging address instead of
# hardcoding eth1.
- name: Find the interface carrying the staging address ({{ staging_ip }})
  ansible.builtin.shell: |
    ip -4 -o addr show | awk -v ip='{{ staging_ip }}' 'index($4, ip "/") == 1 {print $2; exit}'
  register: staging_iface
  changed_when: false
  check_mode: false
  failed_when: staging_iface.stdout | length == 0

- name: Write the dnsmasq config for the isolated staging network
  ansible.builtin.template:
    src: dnsmasq-egse.conf.j2
    dest: /etc/dnsmasq.d/egse-staging.conf
    mode: "0644"
  vars:
    staging_iface_name: "{{ staging_iface.stdout }}"
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: started
    enabled: true

# --- HTTP server (golden image + offline apt repo) ---------------------------

- name: Symlink the golden image into the http root
  ansible.builtin.file:
    src: "{{ demo_dir }}/lab/golden.img"
    dest: "{{ http_root }}/golden.img"
    state: link

# The bundled offline apt repo (built by scripts/fetch_dependencies.sh and
# rsynced with the repo) is served to the PCs at http://<staging>/apt/. It is
# optional — it only exists after the offline dependencies were fetched.
- name: Check whether the bundled offline apt repo is present
  ansible.builtin.stat:
    path: "{{ demo_dir }}/lab/apt-repo/Packages.gz"
  register: apt_repo_stat

- name: Serve the bundled offline apt repo to the PCs
  ansible.builtin.file:
    src: "{{ demo_dir }}/lab/apt-repo"
    dest: "{{ http_root }}/apt"
    state: link
  when: apt_repo_stat.stat.exists

- name: Write the HTTP server systemd unit
  ansible.builtin.template:
    src: egse-http.service.j2
    dest: /etc/systemd/system/egse-http.service
    mode: "0644"
  notify: Restart egse-http

- name: Enable and start the HTTP server
  ansible.builtin.service:
    name: egse-http
    state: started
    enabled: true